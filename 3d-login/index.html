<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AMC 世界 · 3D 自由视角</title>
<style>
  :root { --panel:rgba(16,19,26,.88); --line:#2c313d; --text:#e6e9f0; --dim:#8b93a7; --accent:#5aa9ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b0d12; color:var(--text);
    font:13px/1.45 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  #gl { display:block; width:100vw; height:100vh; touch-action:none; cursor:grab; }
  #gl.dragging { cursor:grabbing; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.45); backdrop-filter:blur(6px); }
  #hud { top:12px; left:12px; width:280px; padding:10px 12px; }
  #hud h1 { margin:0 0 2px; font-size:14px; font-weight:600; }
  #hud .sub { color:var(--dim); font-size:11px; margin-bottom:8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; align-items:center; }
  .worlds { display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 6px; }
  .worlds button { padding:4px 8px; }
  .note { color:#ffd479; font-size:11px; min-height:0; margin:2px 0 4px; }
  button { appearance:none; border:1px solid var(--line); background:#1a1e27; color:var(--text);
    border-radius:7px; padding:5px 9px; font-size:12px; cursor:pointer; }
  button:hover { border-color:#3d4658; background:#212734; }
  button.on { border-color:var(--accent); color:#cfe6ff; background:#172435; }
  .k { color:var(--dim); }
  .v { font-variant-numeric:tabular-nums; }
  #stats { position:fixed; right:12px; top:12px; padding:8px 11px; font-variant-numeric:tabular-nums; min-width:190px; }
  #stats div { white-space:nowrap; }
  #stats .k { display:inline-block; min-width:52px; }
  #help { position:fixed; left:12px; bottom:12px; padding:8px 11px; color:var(--dim); font-size:11.5px; line-height:1.7; }
  #help b { color:var(--text); font-weight:600; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px;
    background:rgba(5,7,10,.92); text-align:center; z-index:10; }
  #err.show { display:flex; }
  #err .box { max-width:560px; }
  #err code { color:#ffd479; }
  #loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); padding:10px 16px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--dim); display:none; }
  #loading.show { display:block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="panel">
  <h1>AMC 世界 · 3D</h1>
  <div class="sub" id="sub">加载地图数据…</div>
  <div class="worlds" id="world-tabs" role="tablist" aria-label="选择世界"></div>
  <div class="note" id="world-note"></div>
  <div class="row">
    <button id="mode-block" class="on">方块颜色</button>
    <button id="mode-height">高度着色</button>
  </div>
  <div class="row">
    <button id="btn-reset">回到起点</button>
    <button id="btn-slow">减速</button>
    <button id="btn-fast">加速</button>
  </div>
  <div class="row"><span class="k">速度</span><span class="v" id="speed">12</span><span class="k">格/秒</span></div>
</div>

<div id="stats" class="panel">
  <div><span class="k">坐标</span><span class="v" id="st-pos">-</span></div>
  <div><span class="k">区块</span><span class="v" id="st-chunk">-</span></div>
  <div><span class="k">朝向</span><span class="v" id="st-dir">-</span></div>
  <div><span class="k">FPS</span><span class="v" id="st-fps">-</span></div>
  <div><span class="k">绘制</span><span class="v" id="st-draw">-</span></div>
</div>

<div id="help" class="panel">
  <b>WASD</b> 平移 · <b>鼠标拖拽</b> 旋转 · <b>滚轮</b> 前后 · <b>空格/Shift</b> 升降<br>
  <b>方向键</b> 平移 · <b>[ ]</b> 调速 · <b>R</b> 回到起点 · <b>1/2</b> 切换着色
</div>

<div id="loading">加载中…</div>

<div id="err"><div class="box">
  <h2>地图数据加载失败</h2>
  <p id="err-msg"></p>
  <p style="color:#8b93a7;font-size:12px">本页读取同源 <code>maps.json</code> 与各世界的 <code>index.json</code>；
  需要静态服务器（file:// 会被浏览器同源策略拦截）。</p>
  <button id="err-retry" type="button">重试</button>
</div></div>

<script>
(function () {
  'use strict';
  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
  var el = function (id) { return document.getElementById(id); };
  if (!gl) { el('err').classList.add('show'); el('err-msg').textContent = '当前浏览器不支持 WebGL2。'; return; }

  // ---------- 矩阵（列主序） ----------
  function perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2);
    return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0]);
  }
  function lookAt(eye, center, up) {
    var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    var zl = Math.hypot(zx, zy, zz) || 1; zx /= zl; zy /= zl; zz /= zl;
    var xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    var xl = Math.hypot(xx, xy, xz) || 1; xx /= xl; xy /= xl; xz /= xl;
    var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1
    ]);
  }
  function mul(a, b) {
    var o = new Float32Array(16);
    for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
    return o;
  }

  // ---------- 着色器 ----------
  var VS = [
    '#version 300 es',
    'layout(location=0) in vec3 aPos;',
    'layout(location=1) in vec3 aNormal;',
    'layout(location=2) in vec3 aColor;',
    'uniform mat4 uViewProj;',
    'out vec3 vNormal; out vec3 vColor; out vec3 vWorld;',
    'void main(){',
    '  vNormal = aNormal; vColor = aColor; vWorld = aPos;',
    '  gl_Position = uViewProj * vec4(aPos, 1.0);',
    '}'
  ].join('\n');
  var FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec3 vNormal; in vec3 vColor; in vec3 vWorld;',
    'uniform vec3 uSun; uniform vec3 uCam; uniform int uMode; uniform vec2 uYRange;',
    'out vec4 outColor;',
    'vec3 ramp(float t){',
    '  t = clamp(t, 0.0, 1.0);',
    '  vec3 c1 = vec3(0.10,0.16,0.35);',
    '  vec3 c2 = vec3(0.10,0.52,0.66);',
    '  vec3 c3 = vec3(0.30,0.70,0.34);',
    '  vec3 c4 = vec3(0.88,0.76,0.26);',
    '  vec3 c5 = vec3(0.98,0.97,0.93);',
    '  if (t < 0.25) return mix(c1, c2, t / 0.25);',
    '  if (t < 0.50) return mix(c2, c3, (t - 0.25) / 0.25);',
    '  if (t < 0.75) return mix(c3, c4, (t - 0.50) / 0.25);',
    '  return mix(c4, c5, (t - 0.75) / 0.25);',
    '}',
    'void main(){',
    '  vec3 n = normalize(vNormal);',
    '  float ndl = max(dot(n, normalize(uSun)), 0.0);',
    '  float light = 0.34 + 0.66 * ndl;',
    '  float t = (vWorld.y - uYRange.x) / max(uYRange.y - uYRange.x, 1.0);',
    '  vec3 base = (uMode == 0) ? vColor : ramp(t);',
    '  float fog = smoothstep(320.0, 1200.0, distance(vWorld, uCam));',
    '  vec3 col = mix(base * light, vec3(0.07,0.08,0.11), fog * 0.9);',
    '  outColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  var U = {
    viewProj: gl.getUniformLocation(prog, 'uViewProj'),
    sun: gl.getUniformLocation(prog, 'uSun'),
    cam: gl.getUniformLocation(prog, 'uCam'),
    mode: gl.getUniformLocation(prog, 'uMode'),
    yRange: gl.getUniformLocation(prog, 'uYRange')
  };

  // ---------- 状态 ----------
  var cam = { pos: [64, 48, 78], yaw: 0, pitch: 0, speed: 12 };
  var keys = Object.create(null);
  var dragging = false, lastX = 0, lastY = 0;
  var chunks = [], queue = [], loading = 0, loaded = 0;
  var shards = [], shardLoading = 0, shardDone = 0, indexMeta = null, legacy = false;
  var SHARD_CONC = 3; // 同时拉取的分片数（每个分片约 1 KB gzip）
  var mode = 0; // 0 方块颜色 1 高度
  var sun = [0.42, 0.86, 0.30];
  var fps = 0, frames = 0, fpsT = performance.now();
  var yRange = [0, 1];
  var drawCount = 0;
  var frustum = [];
  var dpr = 1;
  var MAPS_URL = '/maps.json';
  var maps = [], world = null, worldGen = 0, started = false;

  function fail(msg) {
    el('err').classList.add('show');
    el('err-msg').textContent = msg;
    el('loading').classList.remove('show');
  }

  function clearFail() {
    el('err').classList.remove('show');
    el('err-msg').textContent = '';
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);

  // ---------- 加载 ----------
  function fetchJson(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(url + ' 状态码 ' + r.status);
      return r.json();
    });
  }

  function loadMaps() {
    return fetchJson(MAPS_URL).then(function (d) {
      var list = d && Array.isArray(d.maps) ? d.maps : [];
      if (!list.length) throw new Error('maps.json 没有可用的世界');
      return list;
    });
  }

  function urlWorldKey() {
    try { return new URLSearchParams(location.search).get('world') || ''; } catch (e) { return ''; }
  }

  function setWorldParam(key) {
    try {
      var u = new URL(location.href);
      u.searchParams.set('world', key);
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) { /* file:// 下忽略 */ }
  }

  function tileRoot(name) {
    return '/' + String(name || '').replace(/^\/+/, '').replace(/\/+$/, '') + '/';
  }

  function pickWorld(list) {
    var all = list.filter(function (m) { return m && m.tiles3d; });
    var key = urlWorldKey();
    var found = all.filter(function (m) { return m.key === key; })[0];
    if (found) return found;
    var req = list.filter(function (m) { return m.key === key; })[0];
    var def = all.filter(function (m) { return m.key === 'queue'; })[0] || all[0] || null;
    if (key && def && key !== def.key) {
      el('world-note').textContent = req ? '该世界暂无 3D 视图' : '未找到世界「' + key + '」，已切换到 ' + (def.name || def.label || def.key);
      setWorldParam(def.key);
    }
    return def;
  }

  function paintWorlds(list) {
    var box = el('world-tabs');
    box.textContent = '';
    list.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = m.name || m.label || m.key;
      b.setAttribute('data-world', m.key);
      b.setAttribute('role', 'tab');
      b.className = world && world.key === m.key ? 'on' : '';
      b.addEventListener('click', function () { selectWorld(m, true); });
      box.appendChild(b);
    });
  }

  function disposeWorld() {
    worldGen++;
    for (var i = 0; i < chunks.length; i++) {
      var c = chunks[i];
      if (c.vao) gl.deleteVertexArray(c.vao);
      if (c.vbo) gl.deleteBuffer(c.vbo);
      if (c.ibo) gl.deleteBuffer(c.ibo);
    }
    chunks = [];
    queue = [];
    shards = [];
    shardLoading = 0;
    shardDone = 0;
    loading = 0;
    loaded = 0;
    drawCount = 0;
  }

  function loadIndex(w) {
    var root = tileRoot(w.tiles3d);
    return fetchJson(root + 'index.json').then(function (index) {
      index._root = root;
      return index;
    });
  }

  function planLoad(index, w) {
    var name = w.name || w.label || w.key;
    el('sub').textContent = name + ' · ' + index.chunkStats.blocks + ' 方块 · ' +
      index.totals.triangles + ' 三角形 · ' + (index.totals.bytes / 1024).toFixed(1) + ' KB';
    // 垂直范围由 installIndex 从 manifest.yRange 或 legacy chunks 里取
    // 默认视角按建筑包围盒取景（世界范围很大，按世界取景会看不到建筑）
    var bb = index.blocksBounds;
    var center = bb ? [(bb.min[0] + bb.max[0]) / 2, (bb.min[1] + bb.max[1]) / 2, (bb.min[2] + bb.max[2]) / 2] : [0, 12, 0];
    var diag = bb ? Math.hypot(bb.max[0] - bb.min[0], bb.max[1] - bb.min[1], bb.max[2] - bb.min[2]) : 120;
    if (!isFinite(diag) || diag < 1) diag = 120;
    cam.pos = [center[0] + diag * 0.55, center[1] + diag * 0.5, center[2] + diag * 0.8];
    lookToward(center);
    window.__CENTER__ = center;
    window.__DIAG__ = diag;
    installIndex(index, w);
  }

  // ---------- 分片索引（format amc-3d-index/2）----------
  // 入口 index.json 只含 manifest（约 2 KB）：版本、统计、分片表；
  // 每个分片 idx/s<sx>_<sz>.json 装该 16x16 区块格内的紧凑元组：
  // [cx, cz, partSuffix, vertices, minX, minY, minZ, maxX, maxY, maxZ, blocks]
  // triangles = vertices / 2、quads = vertices / 4、bytes = 48 + vertices*20 + triangles*3*4 均可推导。
  function makeChunk(c, root) {
    var cx = (c.bbox.min[0] + c.bbox.max[0]) / 2;
    var cy = (c.bbox.min[1] + c.bbox.max[1]) / 2;
    var cz = (c.bbox.min[2] + c.bbox.max[2]) / 2;
    return {
      meta: c, src: root + String(c.file || '').replace(/^\/+/, ''),
      loaded: false, vao: null, vbo: null, ibo: null, count: 0,
      center: [cx, cy, cz],
      dist: Math.hypot(cx - cam.pos[0], cy - cam.pos[1], cz - cam.pos[2])
    };
  }

  function chunkFromTuple(t, root) {
    var suffix = String(t[2] || '');
    var v = t[3] | 0;
    var meta = {
      cx: t[0], cz: t[1],
      file: 'tiles/c' + t[0] + '_' + t[1] + (suffix ? '_' + suffix : '') + '.bin',
      vertices: v, triangles: v / 2, quads: v / 4,
      bytes: 48 + v * 20 + (v / 2) * 3 * 4,
      bbox: { min: [t[4], t[5], t[6]], max: [t[7], t[8], t[9]] },
      blocks: t[10]
    };
    return makeChunk(meta, root);
  }

  function sortQueue() {
    queue.sort(function (a, b) { return a.dist - b.dist; });
  }

  function loadShard(s) {
    if (!s || s.state !== 0) return;
    s.state = 1;
    shardLoading++;
    var gen = worldGen;
    fetchJson(s.url).then(function (d) {
      if (gen !== worldGen) return;
      s.state = 2;
      var root = indexMeta._root || '';
      var add = (d && d.chunks) || [];
      for (var i = 0; i < add.length; i++) {
        var c = chunkFromTuple(add[i], root);
        chunks.push(c);
        queue.push(c);
      }
      sortQueue();
      shardDone++;
      el('loading').textContent = '加载分区 ' + shardDone + '/' + shards.length +
        ' · 网格 ' + loaded + '/' + chunks.length;
      if (queue.length) pump();
    }).catch(function (e) {
      if (gen !== worldGen) return;
      s.state = 3;
      s.error = String(e && e.message ? e.message : e);
      el('sub').textContent = '分区加载失败: ' + s.error;
    }).then(function () {
      if (gen !== worldGen) return;
      shardLoading--;
      updateShards();
    });
  }

  function updateShards() {
    if (legacy || !shards.length) return;
    var pend = [];
    for (var i = 0; i < shards.length; i++) {
      var s = shards[i];
      if (s.state !== 0) continue;
      if (frustum.length && !boxVisible(s.bbox)) continue;
      s.dist = Math.hypot(s.center[0] - cam.pos[0], s.center[1] - cam.pos[1], s.center[2] - cam.pos[2]);
      pend.push(s);
    }
    if (!pend.length) return;
    pend.sort(function (a, b) { return a.dist - b.dist; });
    for (var k = 0; k < pend.length && shardLoading < SHARD_CONC; k++) {
      if (pend[k].state === 0) loadShard(pend[k]);
    }
  }

  function installIndex(index, w) {
    var root = index._root || tileRoot(w.tiles3d);
    indexMeta = index;
    legacy = !(index && index.shards && index.shards.items);
    chunks = [];
    queue = [];
    shards = [];
    shardLoading = 0;
    shardDone = 0;
    if (legacy) {
      for (var i = 0; i < (index.chunks || []).length; i++) chunks.push(makeChunk(index.chunks[i], root));
      chunks.sort(function (a, b) { return a.dist - b.dist; });
      queue = chunks.slice();
      var ymin = Infinity, ymax = -Infinity;
      for (var j = 0; j < chunks.length; j++) {
        ymin = Math.min(ymin, chunks[j].meta.bbox.min[1]);
        ymax = Math.max(ymax, chunks[j].meta.bbox.max[1]);
      }
      if (isFinite(ymin)) yRange = [ymin, ymax];
      el('loading').classList.add('show');
      el('loading').textContent = '加载网格 0/' + queue.length;
    } else {
      var sh = index.shards;
      if (Array.isArray(index.yRange) && index.yRange.length === 2) yRange = index.yRange;
      var base = root + String(sh.dir || '');
      var pat = String(sh.file || 's{sx}_{sz}.json');
      for (var k = 0; k < sh.items.length; k++) {
        var it = sh.items[k];
        var bb = { min: [it[3], it[4], it[5]], max: [it[6], it[7], it[8]] };
        shards.push({
          sx: it[0], sz: it[1], count: it[2], bbox: bb,
          center: [(bb.min[0] + bb.max[0]) / 2, (bb.min[1] + bb.max[1]) / 2, (bb.min[2] + bb.max[2]) / 2],
          url: base + pat.replace('{sx}', it[0]).replace('{sz}', it[1]),
          state: 0, dist: 0, error: ''
        });
      }
      el('loading').classList.add('show');
      el('loading').textContent = '加载分区 0/' + shards.length;
    }
    window.__SPAWN__ = w.spawn || (index.world && index.world.spawn) || null;
    window.__INDEX__ = index;
    window.__SHARDS__ = shards;
  }

  function selectWorld(w, updateUrl) {
    if (!w) return;
    if (world && world.key === w.key && chunks.length) return;
    world = w;
    if (updateUrl) { setWorldParam(w.key); el('world-note').textContent = ''; }
    paintWorlds(maps.filter(function (m) { return m && m.tiles3d; }));
    disposeWorld();
    var gen = worldGen;
    el('sub').textContent = (w.name || w.label || w.key) + ' · 加载索引…';
    el('loading').classList.add('show');
    el('loading').textContent = '加载中…';
    loadIndex(w).then(function (index) {
      if (gen !== worldGen) return;
      planLoad(index, w);
      pump();
    }).catch(function (e) {
      if (gen !== worldGen) return;
      fail(String(e && e.message ? e.message : e));
    });
  }

  function lookToward(t) {
    var d = [t[0] - cam.pos[0], t[1] - cam.pos[1], t[2] - cam.pos[2]];
    var len = Math.hypot(d[0], d[1], d[2]) || 1;
    cam.yaw = Math.atan2(d[0], d[2]);
    cam.pitch = Math.asin(Math.max(-0.999, Math.min(0.999, d[1] / len)));
  }

  function parseTile(buf, meta) {
    var dv = new DataView(buf);
    var magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
    if (magic !== 'M3DG') throw new Error(meta.file + ' 魔数不符: ' + magic);
    var version = dv.getUint16(4, true);
    if (version !== 1) throw new Error(meta.file + ' 版本不符: ' + version);
    var vc = dv.getUint32(40, true), ic = dv.getUint32(44, true);
    if (vc !== meta.vertices || ic !== meta.triangles * 3) throw new Error(meta.file + ' 顶点/索引数与 index 不符');
    var vBytes = buf.slice(48, 48 + vc * 20);
    var iBytes = buf.slice(48 + vc * 20, 48 + vc * 20 + ic * 4);
    var vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    var vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, vBytes, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.BYTE, true, 20, 12);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 3, gl.UNSIGNED_BYTE, true, 20, 16);
    var ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, iBytes, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao: vao, vbo: vbo, ibo: ibo, count: ic };
  }

  function pump() {
    if (loading >= 4 || !queue.length) return;
    var c = queue.shift();
    var gen = worldGen;
    loading++;
    fetch(c.src).then(function (r) {
      if (!r.ok) throw new Error(c.src + ' 状态码 ' + r.status);
      return r.arrayBuffer();
    }).then(function (buf) {
      if (gen !== worldGen) return;
      var g = parseTile(buf, c.meta);
      c.vao = g.vao; c.vbo = g.vbo; c.ibo = g.ibo; c.count = g.count; c.loaded = true;
      loaded++;
      el('loading').textContent = '加载网格 ' + loaded + '/' + chunks.length;
      if (loaded >= chunks.length && !shardLoading) { el('loading').classList.remove('show'); el('loading').textContent = '加载中…'; }
    }).catch(function (e) {
      if (gen !== worldGen) return;
      el('sub').textContent = '网格加载失败: ' + (e && e.message ? e.message : e);
    }).then(function () {
      if (gen !== worldGen) return;
      loading--;
      pump();
    });
  }

  // ---------- 视锥剔除 ----------
  function planesOf(m) {
    function pl(a, b, c, d) {
      var l = Math.hypot(a, b, c) || 1;
      return [a / l, b / l, c / l, d / l];
    }
    return [
      pl(m[3] + m[0], m[7] + m[4], m[11] + m[8], m[15] + m[12]),
      pl(m[3] - m[0], m[7] - m[4], m[11] - m[8], m[15] - m[12]),
      pl(m[3] + m[1], m[7] + m[5], m[11] + m[9], m[15] + m[13]),
      pl(m[3] - m[1], m[7] - m[5], m[11] - m[9], m[15] - m[13]),
      pl(m[3] + m[2], m[7] + m[6], m[11] + m[10], m[15] + m[14]),
      pl(m[3] - m[2], m[7] - m[6], m[11] - m[10], m[15] - m[14])
    ];
  }
  function boxVisible(bb) {
    for (var i = 0; i < frustum.length; i++) {
      var p = frustum[i];
      var x = p[0] > 0 ? bb.max[0] : bb.min[0];
      var y = p[1] > 0 ? bb.max[1] : bb.min[1];
      var z = p[2] > 0 ? bb.max[2] : bb.min[2];
      if (p[0] * x + p[1] * y + p[2] * z + p[3] < 0) return false;
    }
    return true;
  }

  // ---------- 渲染 ----------
  function forward() {
    var cp = Math.cos(cam.pitch);
    return [cp * Math.sin(cam.yaw), Math.sin(cam.pitch), cp * Math.cos(cam.yaw)];
  }

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - (frame.last || now)) / 1000);
    frame.last = now;

    // 移动
    var f = forward();
    var fh = [Math.sin(cam.yaw), 0, Math.cos(cam.yaw)];
    var rh = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
    var sp = cam.speed * dt;
    if (keys['w']) { cam.pos[0] += fh[0] * sp; cam.pos[2] += fh[2] * sp; }
    if (keys['s']) { cam.pos[0] -= fh[0] * sp; cam.pos[2] -= fh[2] * sp; }
    if (keys['d']) { cam.pos[0] += rh[0] * sp; cam.pos[2] += rh[2] * sp; }
    if (keys['a']) { cam.pos[0] -= rh[0] * sp; cam.pos[2] -= rh[2] * sp; }
    if (keys[' ']) cam.pos[1] += sp;
    if (keys['shift']) cam.pos[1] -= sp;
    if (keys['arrowleft']) { cam.pos[0] -= rh[0] * sp; cam.pos[2] -= rh[2] * sp; }
    if (keys['arrowright']) { cam.pos[0] += rh[0] * sp; cam.pos[2] += rh[2] * sp; }
    if (keys['arrowup']) { cam.pos[0] += fh[0] * sp; cam.pos[2] += fh[2] * sp; }
    if (keys['arrowdown']) { cam.pos[0] -= fh[0] * sp; cam.pos[2] -= fh[2] * sp; }

    var aspect = canvas.width / Math.max(1, canvas.height);
    var proj = perspective(Math.PI / 3, aspect, 0.1, 2000);
    var view = lookAt(cam.pos, [cam.pos[0] + f[0], cam.pos[1] + f[1], cam.pos[2] + f[2]], [0, 1, 0]);
    var vp = mul(proj, view);
    frustum = planesOf(vp);

    gl.clearColor(0.07, 0.08, 0.11, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.useProgram(prog);
    gl.uniformMatrix4fv(U.viewProj, false, vp);
    gl.uniform3fv(U.sun, sun);
    gl.uniform3fv(U.cam, cam.pos);
    gl.uniform1i(U.mode, mode);
    gl.uniform2f(U.yRange, yRange[0], yRange[1]);

    drawCount = 0;
    for (var i = 0; i < chunks.length; i++) {
      var c = chunks[i];
      if (!c.loaded) continue;
      if (!boxVisible(c.meta.bbox)) continue;
      gl.bindVertexArray(c.vao);
      gl.drawElements(gl.TRIANGLES, c.count, gl.UNSIGNED_INT, 0);
      drawCount++;
    }
    gl.bindVertexArray(null);

    // 按需加载：先按可见性补分区清单，再补网格，均按距离优先
    updateShards();
    pump();

    // HUD
    frames++;
    if (now - fpsT > 400) {
      fps = Math.round(frames * 1000 / (now - fpsT));
      frames = 0; fpsT = now;
      el('st-fps').textContent = fps;
    }
    el('st-pos').textContent = cam.pos.map(function (v) { return v.toFixed(1); }).join(', ');
    el('st-chunk').textContent = Math.floor(cam.pos[0] / 16) + ', ' + Math.floor(cam.pos[2] / 16);
    el('st-dir').textContent = 'yaw ' + (cam.yaw * 180 / Math.PI).toFixed(0) + '° pitch ' + (cam.pitch * 180 / Math.PI).toFixed(0) + '°';
    el('st-draw').textContent = drawCount + '/' + chunks.length + ' 区块';
  }

  // ---------- 输入 ----------
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'shift') keys['shift'] = true;
    else if (k === ' ' || k === 'spacebar') keys[' '] = true;
    else if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) keys[k] = true;
    else if (k === 'r') resetView();
    else if (k === '1') setMode(0);
    else if (k === '2') setMode(1);
    else if (k === '[' || k === ']') {
      cam.speed = Math.max(2, Math.min(64, cam.speed + (k === ']' ? 2 : -2)));
      el('speed').textContent = cam.speed;
    }
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'shift') keys['shift'] = false;
    else if (k === ' ' || k === 'spacebar') keys[' '] = false;
    else keys[k] = false;
  });
  window.addEventListener('blur', function () { keys = Object.create(null); });

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    cam.yaw -= (e.clientX - lastX) * 0.005;
    cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch - (e.clientY - lastY) * 0.005));
    lastX = e.clientX; lastY = e.clientY;
  });
  function stopDrag() { dragging = false; canvas.classList.remove('dragging'); }
  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var f = forward();
    var step = Math.max(-6, Math.min(6, -e.deltaY * 0.03));
    cam.pos[0] += f[0] * step; cam.pos[1] += f[1] * step; cam.pos[2] += f[2] * step;
  }, { passive: false });

  function resetView() {
    var c = window.__CENTER__ || [8, 12, 18];
    var d = window.__DIAG__ || 120;
    cam.pos = [c[0] + d * 0.55, c[1] + d * 0.5, c[2] + d * 0.8];
    lookToward(c);
  }
  function setMode(m) {
    mode = m;
    el('mode-block').classList.toggle('on', m === 0);
    el('mode-height').classList.toggle('on', m === 1);
  }
  el('mode-block').addEventListener('click', function () { setMode(0); });
  el('mode-height').addEventListener('click', function () { setMode(1); });
  el('btn-reset').addEventListener('click', resetView);
  el('btn-slow').addEventListener('click', function () { cam.speed = Math.max(2, cam.speed - 2); el('speed').textContent = cam.speed; });
  el('btn-fast').addEventListener('click', function () { cam.speed = Math.min(64, cam.speed + 2); el('speed').textContent = cam.speed; });

  // ---------- 启动 ----------
  function boot() {
    clearFail();
    el('world-note').textContent = '';
    el('sub').textContent = '加载地图数据…';
    el('loading').classList.add('show');
    el('loading').textContent = '加载中…';
    loadMaps().then(function (list) {
      maps = list;
      var all = list.filter(function (m) { return m && m.tiles3d; });
      if (!all.length) throw new Error('maps.json 没有可用的 3D 世界');
      var w = pickWorld(list);
      if (!w) throw new Error('maps.json 没有可用的 3D 世界');
      world = w;
      paintWorlds(all);
      selectWorld(w, false);
    }).catch(function (e) {
      fail(String(e && e.message ? e.message : e));
    });
  }

  el('err-retry').addEventListener('click', boot);
  resize();
  if (!started) { started = true; requestAnimationFrame(frame); }
  boot();
})();
</script>
</body>
</html>
